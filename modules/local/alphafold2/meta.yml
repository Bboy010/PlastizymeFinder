name: alphafold2
description: Predict the 3D structure of a candidate plastizyme with AlphaFold2
keywords:
  - structure prediction
  - AlphaFold2
  - protein folding
tools:
  - alphafold2:
      description: |
        AlphaFold2 predicts a protein's three-dimensional structure from its
        amino-acid sequence, using multiple sequence alignments and templates.
      homepage: https://github.com/google-deepmind/alphafold
      doi: 10.1038/s41586-021-03819-2
      licence: ["Apache-2.0"]
      identifier: biotools:alphafold
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. [ id:'sample1' ]
    - fasta:
        type: file
        description: Candidate protein sequences in FASTA format
        pattern: "*.{fa,faa,fasta}"
output:
  pdb:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.alphafold2.pdb":
          type: file
          description: Top-ranked predicted structure
          pattern: "*.alphafold2.pdb"
  raw:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "raw/**":
          type: file
          description: Full AlphaFold2 output, including all ranked models and scores
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@Bboy010"
maintainers:
  - "@Bboy010"
